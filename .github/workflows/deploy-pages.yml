# Deploys the web edition of Floor Plan 3D to GitHub Pages.
#
# The app is a zero-build static site (public/floorplan.html + vendored Three.js),
# so deployment simply assembles those files into a site root where the plan
# is served as index.html.
#
# One-time setup: after the first successful run, go to
# Settings → Pages and make sure "Source" is "GitHub Actions"
# (the workflow enables this automatically when possible).
#
# Your app will be live at:  https://<your-username>.github.io/<repo-name>/
name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp public/floorplan.html _site/index.html
          cp -r public/vendor    _site/vendor
          cp public/robots.txt   _site/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
